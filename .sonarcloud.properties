# SonarCloud automatic analysis configuration
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis

# Explicit source roots: production TypeScript only. This keeps the source set
# disjoint from sonar.tests below (source/test overlap fails the analysis) and
# keeps the generated main.js bundle out of scope entirely.
sonar.sources=main.ts,src

# tests/ holds Vitest unit tests; classify them as test code so they are
# exempt from duplication metrics and coverage requirements on new code
sonar.tests=tests
